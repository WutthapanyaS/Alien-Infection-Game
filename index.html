<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#030810" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Alien Infection" />
  <title>Alien Infection</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="stars-canvas"></canvas>

  <div id="app">

    <!-- ── Header ── -->
    <header>
      <h1>ALIEN<br/>INFECTION</h1>
      <p class="subtitle">PROCEDURAL LOGIC PUZZLE</p>
    </header>

    <!-- ── Mission Briefing ── -->
    <div id="game-info" class="hidden">
      <div class="briefing-label">MISSION BRIEFING</div>
      <div class="info-grid">
        <div class="info-card">
          <span class="info-label">CREW SIZE</span>
          <span class="info-value" id="crew-count">—</span>
        </div>
        <div class="info-card danger">
          <span class="info-label">INFECTED</span>
          <span class="info-value" id="infected-count">—</span>
        </div>
        <div class="info-card safe">
          <span class="info-label">TRUTHFUL</span>
          <span class="info-value" id="truthful-count">—</span>
        </div>
        <div class="info-card warn">
          <span class="info-label">LIARS</span>
          <span class="info-value" id="liar-count">—</span>
        </div>
      </div>
      <p class="briefing-hint">
        Read each crew member's statement. Mark exactly <strong id="hint-infected">N</strong>
        infected crew members and submit your report.
      </p>
    </div>

    <!-- ── Crew Cards ── -->
    <div id="crew-list"></div>

    <!-- ── Controls ── -->
    <div id="controls" class="hidden">
      <button id="submit-btn" onclick="checkSolution()">SUBMIT REPORT</button>
      <button id="new-game-btn" onclick="startNewGame()">NEW MISSION</button>
    </div>

    <!-- ── Result Banner ── -->
    <div id="result" class="hidden"></div>

    <!-- ── Loading ── -->
    <div id="loading">
      <div class="spinner"></div>
      <p id="loading-text">GENERATING MISSION…</p>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
